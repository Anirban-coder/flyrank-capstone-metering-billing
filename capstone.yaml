run: docker compose up -d && uvicorn main:app --reload
seed: python create_tables.py && python seed.py
test: pytest test_pricing.py -v
base_url: http://localhost:8000
endpoints:
  - method: POST
    path: /generate
  - method: GET
    path: /usage/{tenant_id}
  - method: POST
    path: /checkout
  - method: GET
    path: /checkout-page
  - method: POST
    path: /webhooks/razorpay
 